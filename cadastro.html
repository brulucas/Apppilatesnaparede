<!DOCTYPE html>
<html lang="pt-BR" data-theme="light">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1" />
  <meta name="theme-color" content="#FBFAFB" />
  <meta name="robots" content="noindex, nofollow" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800;900&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css?v=29" />
  <title>Acessar Desafio · Pilates na Parede</title>
</head>
<body>
<div class="auth-page">
  <div class="auth-brand">
    <div class="dot">P</div>
    <div class="name">Pilates na Parede<span class="sub">Desafio de 21 dias</span></div>
  </div>

  <div class="auth-hero">
    <h1>Acesse seu desafio</h1>
    <p>Digite seu e-mail para acessar o aplicativo do Desafio de 21 dias. Seu progresso, treinos e histórico ficam salvos na sua conta.</p>
  </div>

  <form class="auth-form" id="signupForm" novalidate>
    <div class="auth-field">
      <label for="f-email">E-mail</label>
      <div class="auth-input-wrap">
        <input id="f-email" type="email" autocomplete="email" placeholder="voce@exemplo.com" required inputmode="email" autofocus />
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"/><polyline points="22,6 12,13 2,6"/></svg>
      </div>
    </div>

    <button type="submit" class="auth-submit" id="submitBtn">ENTRAR NO DESAFIO</button>
    <div class="auth-err" id="err"></div>
  </form>

  <div class="auth-footer" style="opacity: 0.8; font-size: 12px;">
    Acesso direto pelo e-mail cadastrado · Sem necessidade de senha
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script src="config.js"></script>
<script src="auth.js"></script>
<script>
// Se já logado, manda direto pro app
Auth?.redirectIfLogged?.();

// ---------- UTM tracking ----------
(function captureUtm() {
  try {
    const url = new URL(location.href);
    const utm = url.searchParams.get('utm_source');
    if (utm) {
      localStorage.setItem('pp21_utm', JSON.stringify({ v: utm, t: Date.now() }));
    }
  } catch (e) {}
})();

function getUtm() {
  try {
    const raw = localStorage.getItem('pp21_utm');
    if (!raw) return null;
    const parsed = JSON.parse(raw);
    if (Date.now() - parsed.t > 30 * 24 * 60 * 60 * 1000) {
      localStorage.removeItem('pp21_utm');
      return null;
    }
    return parsed.v || null;
  } catch (e) { return null; }
}

// Modal de confirmação de e-mail
function askEmailConfirm(email) {
  return new Promise(resolve => {
    const back = document.createElement('div');
    back.style.cssText = 'position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:100;display:flex;align-items:center;justify-content:center;padding:20px;backdrop-filter:blur(4px);';
    back.innerHTML = `
      <div style="background:var(--bg-elevated);border-radius:16px;padding:24px 22px;max-width:400px;width:100%;border:1px solid var(--border-soft);box-shadow:0 20px 60px rgba(0,0,0,.35);">
        <div style="font-size:17px;font-weight:700;margin-bottom:6px;color:var(--ink);">Confirme seu e-mail</div>
        <div style="font-size:14px;color:var(--ink-muted);line-height:1.5;margin-bottom:16px;">Vamos liberar seu acesso com:</div>
        <div style="background:var(--bg-muted);padding:12px 14px;border-radius:10px;font-weight:600;font-size:14px;color:var(--ink);word-break:break-all;margin-bottom:18px;">${email.replace(/</g,'&lt;')}</div>
        <div style="font-size:13px;color:var(--ink-muted);margin-bottom:20px;">Este é o e-mail correto? Seu progresso ficará vinculado a ele.</div>
        <div style="display:flex;gap:10px;">
          <button type="button" id="_cancel" style="flex:1;padding:12px;background:var(--bg-muted);border:0;border-radius:999px;font-weight:600;font-size:13px;color:var(--ink);cursor:pointer;">Voltar</button>
          <button type="button" id="_confirm" style="flex:1;padding:12px;background:var(--brand);color:#fff;border:0;border-radius:999px;font-weight:700;font-size:13px;cursor:pointer;">Confirmar</button>
        </div>
      </div>
    `;
    document.body.appendChild(back);
    back.querySelector('#_cancel').onclick  = () => { back.remove(); resolve(false); };
    back.querySelector('#_confirm').onclick = () => { back.remove(); resolve(true); };
    back.onclick = (e) => { if (e.target === back) { back.remove(); resolve(false); } };
  });
}

// Submit
document.getElementById('signupForm').addEventListener('submit', async (e) => {
  e.preventDefault();
  const err = document.getElementById('err');
  const btn = document.getElementById('submitBtn');
  err.textContent = '';

  const email = document.getElementById('f-email').value.trim();

  if (!email || !/^\S+@\S+\.\S+$/.test(email)) {
    err.textContent = 'Digite um e-mail válido.';
    return;
  }

  const ok = await askEmailConfirm(email);
  if (!ok) return;

  btn.disabled = true; btn.textContent = 'Entrando...';
  try {
    await Auth.signInWithEmailOnly({ email, utm_source: getUtm() });

    // Verifica se onboarding já foi feito
    const stateRaw = localStorage.getItem('pp21_state_v1');
    let hasOnboarding = false;
    if (stateRaw) {
      try {
        const parsed = JSON.parse(stateRaw);
        hasOnboarding = Boolean(parsed.onboardingDone);
      } catch (ex) {}
    }

    if (hasOnboarding) {
      location.replace('/#/plano');
    } else {
      location.replace('/#/onboarding');
    }
  } catch (ex) {
    err.textContent = ex.message || 'Algo deu errado. Tente novamente.';
    btn.disabled = false; btn.textContent = 'ENTRAR NO DESAFIO';
  }
});
</script>
</body>
</html>
