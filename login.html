<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1" />
  <meta name="theme-color" content="#FBFAFB" />
  <meta name="robots" content="noindex, nofollow" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800;900&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css?v=28" />
  <title>Entrar · Pilates na Parede</title>
</head>
<body>
<div class="auth-page">
  <div class="auth-brand">
    <div class="dot">P</div>
    <div class="name">Pilates na Parede<span class="sub">Desafio de 21 dias</span></div>
  </div>

  <div class="auth-hero">
    <h1>Entrar no aplicativo</h1>
    <p>Digite seu e-mail para continuar seus treinos.</p>
  </div>

  <form class="auth-form" id="loginForm" novalidate>
    <div class="auth-field">
      <label for="f-email">E-mail</label>
      <div class="auth-input-wrap">
        <input id="f-email" type="email" autocomplete="email" placeholder="voce@exemplo.com" required inputmode="email" autofocus />
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"/><polyline points="22,6 12,13 2,6"/></svg>
      </div>
    </div>

    <button type="submit" class="auth-submit" id="submitBtn">Entrar</button>
    <div class="auth-err" id="err"></div>
  </form>

  <div class="auth-footer">
    Acesso direto pelo e-mail cadastrado
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script src="config.js"></script>
<script src="auth.js"></script>
<script>
Auth?.redirectIfLogged?.();

document.getElementById('loginForm').addEventListener('submit', async (e) => {
  e.preventDefault();
  const err = document.getElementById('err');
  const btn = document.getElementById('submitBtn');
  err.textContent = '';

  const email = document.getElementById('f-email').value.trim();
  if (!/^\S+@\S+\.\S+$/.test(email)) {
    err.textContent = 'Digite um e-mail válido.';
    return;
  }

  btn.disabled = true; btn.textContent = 'Entrando...';
  try {
    await Auth.signInWithEmailOnly({ email });
    location.replace('/');
  } catch (ex) {
    err.textContent = ex.message || 'Erro ao entrar.';
    btn.disabled = false; btn.textContent = 'Entrar';
  }
});
</script>
</body>
</html>
