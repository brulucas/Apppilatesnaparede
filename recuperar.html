<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1" />
  <meta name="theme-color" content="#FBFAFB" />
  <meta name="robots" content="noindex, nofollow" />
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800;900&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css?v=28" />
  <title>Recuperar senha · Pilates na Parede</title>
</head>
<body>
<div class="auth-page">
  <div class="auth-brand">
    <div class="dot">P</div>
    <div class="name">Pilates na Parede<span class="sub">Desafio de 21 dias</span></div>
  </div>

  <div class="auth-hero">
    <h1>Recuperar senha</h1>
    <p>Digite seu e-mail. A gente te envia um link pra você criar uma senha nova.</p>
  </div>

  <form class="auth-form" id="resetForm" novalidate>
    <div class="auth-field">
      <label for="f-email">E-mail</label>
      <input id="f-email" type="email" autocomplete="email" placeholder="voce@exemplo.com" required inputmode="email" />
    </div>

    <button type="submit" class="auth-submit" id="submitBtn">Enviar link</button>
    <div class="auth-err" id="err"></div>
  </form>

  <div class="auth-footer">
    Lembrou? <a href="/login">Voltar para o login</a>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script src="config.js"></script>
<script src="auth.js"></script>
<script>
Auth?.redirectIfLogged?.();

document.getElementById('resetForm').addEventListener('submit', async (e) => {
  e.preventDefault();
  const err = document.getElementById('err');
  const btn = document.getElementById('submitBtn');
  err.textContent = '';
  const email = document.getElementById('f-email').value.trim();
  if (!/^\S+@\S+\.\S+$/.test(email)) { err.textContent = 'E-mail inválido.'; return; }

  btn.disabled = true; btn.textContent = 'Enviando...';
  try {
    await Auth.resetPassword(email);
    document.querySelector('.auth-page').innerHTML = `
      <div class="auth-brand"><div class="dot">P</div><div class="name">Pilates na Parede</div></div>
      <div class="auth-success">
        <div class="icon">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg>
        </div>
        <h2>Link enviado!</h2>
        <p>Se existir uma conta com <strong>${email.replace(/</g,'&lt;')}</strong>, você vai receber um e-mail em instantes. Verifique também a pasta de spam.</p>
        <a href="/login" style="display:inline-block;margin-top:24px;padding:14px 24px;background:var(--brand);color:#fff;border-radius:999px;text-decoration:none;font-weight:700;font-size:13px;letter-spacing:.06em;text-transform:uppercase;">Voltar para login</a>
      </div>
    `;
  } catch (ex) {
    err.textContent = ex.message;
    btn.disabled = false; btn.textContent = 'Enviar link';
  }
});
</script>
</body>
</html>
